# Convenience PostgreSQL instance for local development.
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: yam-zabb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yam_zabb_pos
    ports:
      - '5432:5432'
    volumes:
      - yam_zabb_pgdata:/var/lib/postgresql/data

volumes:
  yam_zabb_pgdata:
