name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        # GITHUB_PAGES switches vite.config.js to the /yamzab_pos/ base path.
        # No backend is deployed alongside this static build — see README.md's
        # "Deploying the client to GitHub Pages" section for what that means.
        run: npm run build --workspace client
        env:
          GITHUB_PAGES: 'true'

      - name: SPA fallback for client-side routing
        # GitHub Pages has no rewrite rules, so a direct hit on e.g. /pos would
        # 404. Serving a copy of index.html as 404.html lets react-router take
        # over client-side once it loads.
        run: cp client/dist/index.html client/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
